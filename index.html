<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="A 100-day daily AI building challenge. 100 prompts, 100 builds, shipped publicly." />
  <meta property="og:title" content="vibe100 — 100-day AI building challenge" />
  <meta property="og:description" content="A daily building challenge. 100 prompts, 100 builds, shipped publicly." />
  <meta property="og:url" content="https://vibe100.co" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="vibe100 — 100-day AI building challenge" />
  <meta name="twitter:description" content="A daily building challenge. 100 prompts, 100 builds, shipped publicly." />
  <title>vibe100 — 100-day AI building challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] { display: none !important; }

    html, body {
      height: 100%;
    }

    body {
      background-color: #0a0a0a;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 64px 64px;
      color: #777;
      font-family: 'IBM Plex Mono', monospace;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 4vh 4vw;
    }

    /* ── Terminal window ── */
    .terminal-window {
      width: 100%;
      max-width: 960px;
      height: 92vh;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Title bar ── */
    .term-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 14px 20px;
      background: #141414;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-r { background: #ff5f56; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #27c93f; }

    .term-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #555;
      margin-left: 10px;
      letter-spacing: 0.04em;
    }

    /* ── Window body ── */
    .window-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 48px 56px 32px;
      overflow: hidden;
      position: relative;
    }

    /* ── Middle content ── */
    .content-mid {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 24px;
    }

    /* ── Badge ── */
    .badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #F0935A;
      border: 1px solid rgba(240, 147, 90, 0.5);
      border-radius: 4px;
      padding: 5px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: center;
    }


    /* ── Hero title ── */
    .hero-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(72px, 11vw, 148px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
      display: inline-block;
      position: relative;
      animation: glitch-main 4s infinite;
    }

    .hero-title .vibe   { color: #ffffff; }
    .hero-title .hundred { color: #F0935A; }

    .hero-title::before,
    .hero-title::after {
      content: 'vibe100';
      position: absolute;
      top: 0; left: 0;
      font-family: 'Syne', sans-serif;
      font-size: clamp(72px, 11vw, 148px);
      font-weight: 800;
      letter-spacing: -4px;
      line-height: 1;
    }

    .hero-title::before {
      color: #ff0055;
      clip-path: polygon(0 22%, 100% 22%, 100% 40%, 0 40%);
      animation: glitch-r 4s infinite;
    }

    .hero-title::after {
      color: #00e5ff;
      clip-path: polygon(0 62%, 100% 62%, 100% 76%, 0 76%);
      animation: glitch-c 4s infinite;
    }

    @keyframes glitch-main {
      0%, 88%, 100% { transform: translateX(0); }
      90%           { transform: translateX(-3px); }
      92%           { transform: translateX(3px); }
      94%           { transform: translateX(-1px); }
      96%           { transform: translateX(0); }
    }

    @keyframes glitch-r {
      0%, 88%, 100% { opacity: 0; }
      89%, 93%      { opacity: 1; transform: translateX(-4px); }
      91%            { transform: translateX(4px); }
    }

    @keyframes glitch-c {
      0%, 88%, 100% { opacity: 0; }
      89%, 93%      { opacity: 1; transform: translateX(4px); }
      91%            { transform: translateX(-4px); }
    }

    /* ── Subtext ── */
    .subtext {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 16px;
      color: #777;
      line-height: 1.7;
      text-align: center;
    }

    .accent { color: #F0935A; }

    /* ── Typewriter ── */
    .typewriter-row {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 15px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 24px;
    }

    .tw-arrow { color: #F0935A; flex-shrink: 0; font-weight: 700; font-size: 20px; position: relative; top: -1px; }
    .tw-text  { color: #aaa; }

    .tw-cursor {
      display: inline-block;
      width: 10px;
      height: 17px;
      background: #F0935A;
      vertical-align: middle;
      margin-left: 2px;
      animation: cursor-blink 1s step-end infinite;
    }

    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── Form ── */
    .form-wrap {
      display: flex;
      flex-direction: column;
      max-width: 680px;
      width: 100%;
    }

    .email-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row { display: flex; }

    .email-input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 15px;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-right: none;
      border-radius: 6px 0 0 6px;
      color: #bbb;
      padding: 14px 18px;
      flex: 1;
      outline: none;
      transition: border-color 0.15s;
    }

    .email-input::placeholder { color: #444; }
    .email-input:focus        { border-color: #F0935A; }

    .submit-btn {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: #F0935A;
      color: #0a0a0a;
      border: none;
      border-radius: 0 6px 6px 0;
      padding: 14px 26px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .submit-btn:hover    { background: #e08560; }
    .submit-btn:disabled { background: #7a4a23; cursor: not-allowed; }

    .fine-print {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #444;
      letter-spacing: 0.03em;
    }

    .form-error {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #ff6b6b;
      min-height: 18px;
    }

    .success-msg {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 15px;
      color: #F0935A;
      border: 1px solid rgba(217, 119, 87, 0.2);
      background: rgba(217, 119, 87, 0.04);
      border-radius: 6px;
      padding: 14px 18px;
      letter-spacing: 0.02em;
    }

    /* ── Footer / social ── */
    .social-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 24px;
      border-top: 1px solid #1e1e1e;
      flex-shrink: 0;
    }

    .footer-logo {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
      text-decoration: none;
    }
    .footer-logo .v { color: #fff; }
    .footer-logo .h { color: #F0935A; }

    .social-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .follow-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #444;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: #888;
      text-decoration: none;
      transition: color 0.15s;
    }

    .social-link:hover { color: #F0935A; }

    .social-link svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ── Page load animations ── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .terminal-window { animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .badge           { animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both; }
    .hero-title      { animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both; }
    .subtext         { animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both; }
    .typewriter-row  { animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.65s both; }
    .form-wrap       { animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.75s both; }
    .social-row      { animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.9s both; }

    /* ── AI tool stickers ── */
    .terminal-outer {
      position: relative;
      width: 100%;
      max-width: 960px;
    }

    .stickers {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: visible;
    }

    .sticker {
      position: absolute;
      width: 78px;
      height: 78px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.75), 0 2px 6px rgba(0,0,0,0.4);
      opacity: 0;
      cursor: pointer;
      pointer-events: auto;
      will-change: transform, opacity;
    }

    .sticker img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      border-radius: 20px;
    }

    /* positions — left side (2) and right side (3) */
    .sticker-claude   { top: 16%;  left: -90px;  }
    .sticker-chatgpt  { top: 72%;  left: -90px;  }
    .sticker-cursor   { top: 6%;   right: -108px; }
    .sticker-copilot  { top: 42%;  right: -112px; }
    .sticker-replit   { top: 74%;  right: -94px;  }

    @media (max-width: 640px) {
      .stickers { display: none; }
    }

    /* ── Scanlines ── */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0, 0, 0, 0.06) 3px,
        rgba(0, 0, 0, 0.06) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      body { padding: 3vh 3vw; }

      .terminal-outer  { width: 100%; }
      .terminal-window { height: auto; min-height: 94vh; border-radius: 10px; }

      .window-body { padding: 28px 24px 24px; }

      .content-mid { gap: 18px; }

      .hero-title {
        font-size: clamp(40px, 12vw, 64px);
        letter-spacing: -2px;
      }

      .hero-title::before,
      .hero-title::after {
        font-size: clamp(40px, 12vw, 64px);
        letter-spacing: -2px;
      }

      .subtext      { font-size: 14px; }
      .typewriter-row { font-size: 13px; }

      /* Stack form vertically on small screens */
      .input-row { flex-direction: column; }

      .email-input {
        font-size: 14px;
        border-right: 1px solid #2a2a2a;
        border-bottom: none;
        border-radius: 6px 6px 0 0;
      }

      .email-input:focus { border-color: #F0935A; }

      .submit-btn {
        font-size: 14px;
        padding: 14px 16px;
        border-radius: 0 0 6px 6px;
        width: 100%;
      }

      .follow-label { display: none; }
    }
  </style>
</head>
<body>

  <div class="terminal-outer">
  <div class="terminal-window">

    <!-- Title bar -->
    <div class="term-bar">
      <span class="dot dot-r"></span>
      <span class="dot dot-y"></span>
      <span class="dot dot-g"></span>
      <span class="term-label">vibe100 — daily-prompt.txt</span>
    </div>

    <!-- Window body -->
    <div class="window-body">

      <!-- Middle content -->
      <div class="content-mid">

        <div class="badge">// 100-day AI building challenge</div>

        <h1 class="hero-title">
          <span class="vibe">vibe</span><span class="hundred">100</span>
        </h1>

        <p class="subtext">
          A daily building challenge.
          <span class="accent">100 prompts, 100 builds,</span>
          shipped publicly.
        </p>

        <div class="typewriter-row">
          <span class="tw-arrow">›</span>
          <span class="tw-text" id="tw-text"></span><span class="tw-cursor"></span>
        </div>

        <div class="form-wrap" id="form-wrap">
          <form class="email-form" id="email-form" novalidate>
            <div class="input-row">
              <input
                type="email"
                id="email-input"
                class="email-input"
                placeholder="Enter your email to receive daily prompts"
                required
                autocomplete="email"
              />
              <button type="submit" class="submit-btn" id="submit-btn">Count me in</button>
            </div>
            <p class="fine-print">No spam. No data sharing. Just build prompts.</p>
            <p class="form-error" id="form-error" aria-live="polite"></p>
          </form>

          <div class="success-msg" id="success-msg" hidden>
            You're in. Day 1 prompt is on its way. 🚀
          </div>
        </div>

      </div><!-- /content-mid -->

      <!-- Footer -->
      <div class="social-row">
        <span class="footer-logo"><span class="v">vibe</span><span class="h">100</span></span>
        <div class="social-right">
          <span class="follow-label">follow along</span>
          <a class="social-link" href="https://twitter.com/vibe100build" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.911-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
            vibe100build
          </a>
          <a class="social-link" href="https://linkedin.com/company/vibe100" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
            vibe100
          </a>
        </div>
      </div>

    </div><!-- /window-body -->
  </div><!-- /terminal-window -->

  <!-- AI tool stickers (outside the card) -->
  <div class="stickers" aria-hidden="true">
    <!-- Left side: 2 icons -->
    <div class="sticker sticker-claude"  data-rot="-10" data-depth="0.55" data-entry="top-left">
      <img src="assets/stickers/Frame 8.png" alt="Claude" draggable="false" />
    </div>
    <div class="sticker sticker-chatgpt" data-rot="8"   data-depth="0.65" data-entry="bottom-left">
      <img src="assets/stickers/Frame 4.png" alt="Cursor" draggable="false" />
    </div>
    <!-- Right side: 3 icons -->
    <div class="sticker sticker-cursor"  data-rot="11"  data-depth="0.70" data-entry="top-right">
      <img src="assets/stickers/Frame 5.png" alt="ChatGPT" draggable="false" />
    </div>
    <div class="sticker sticker-copilot" data-rot="-9"  data-depth="0.45" data-entry="right">
      <img src="assets/stickers/Frame 7.png" alt="Copilot" draggable="false" />
    </div>
    <div class="sticker sticker-replit"  data-rot="7"   data-depth="0.55" data-entry="bottom-right">
      <img src="assets/stickers/Frame 6.png" alt="Replit" draggable="false" />
    </div>
  </div>

  </div><!-- /terminal-outer -->

  <!-- Scanline overlay -->
  <div class="scanlines" aria-hidden="true"></div>

  <script>
    (function () {
      const sentences = [
        "The best way to go from AI-curious to AI-native.",
        "Join and receive a daily prompt every day.",
        "Build with any tool you like.",
        "Share your build and get featured."
      ];

      const el = document.getElementById('tw-text');
      let current = 0;
      let charIndex = 0;
      let isDeleting = false;

      function tick() {
        const text = sentences[current];

        if (!isDeleting) {
          el.textContent = text.slice(0, charIndex + 1);
          charIndex++;
          if (charIndex === text.length) {
            isDeleting = true;
            setTimeout(tick, 1800);
            return;
          }
        } else {
          el.textContent = text.slice(0, charIndex - 1);
          charIndex--;
          if (charIndex === 0) {
            isDeleting = false;
            current = (current + 1) % sentences.length;
            charIndex = 0;
            setTimeout(tick, 300);
            return;
          }
        }

        setTimeout(tick, isDeleting ? 25 : 45);
      }

      tick();
    }());

    (function () {
      const KIT_ENDPOINT = 'https://app.convertkit.com/forms/9259428/subscriptions';

      const form = document.getElementById('email-form');
      const input = document.getElementById('email-input');
      const btn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('form-error');
      const successEl = document.getElementById('success-msg');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorEl.textContent = '';

        const email = input.value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          errorEl.textContent = 'Please enter a valid email address.';
          input.focus();
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Counting...';

        try {
          const res = await fetch(KIT_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email_address: email })
          });

          if (!res.ok) throw new Error('Kit API returned ' + res.status);

          form.hidden = true;
          successEl.hidden = false;
        } catch (err) {
          errorEl.textContent = 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Count me in';
        }
      });
    }());

    // ── Sticker animations ──────────────────────────────────────────
    (function () {
      const ENTRY = {
        top:          [   0, -180],
        bottom:       [   0,  180],
        left:         [-180,    0],
        right:        [ 180,    0],
        'top-left':   [-160, -160],
        'top-right':  [ 160, -160],
        'bottom-left':[-160,  160],
        'bottom-right':[ 160, 160],
      };
      const LERP_PARA  = 0.04;   // parallax smoothing
      const LERP_ROT   = 0.12;   // rotation / scale smoothing
      const LERP_ENTRY = 0.055;  // entry fly-in smoothing
      const PARA_RANGE = 75;     // max parallax px

      // Build state objects
      const stickers = Array.from(document.querySelectorAll('.sticker')).map((el, i) => {
        const baseRot = parseFloat(el.dataset.rot) || 0;
        const depth   = parseFloat(el.dataset.depth) || 0.04;
        const [ex, ey] = ENTRY[el.dataset.entry || 'top'];
        return {
          el,
          baseRot,
          depth,
          // current animated values
          ex: ex, ey: ey,   // entry offset (flies from here to 0)
          px: 0, py: 0,     // parallax offset
          rot: baseRot,
          sc: 0.75,
          opacity: 0,
          // targets
          targetRot: baseRot,
          targetSc: 1,
          targetOpacity: 1,
          // state
          ready: false,
          hoverRot: 0,
        };
      });

      // Stagger entry: each sticker becomes "ready" with a delay
      stickers.forEach((s, i) => {
        setTimeout(() => { s.ready = true; }, 500 + i * 120);
      });

      // Mouse tracking
      let mx = window.innerWidth  / 2;
      let my = window.innerHeight / 2;
      window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

      // Hover: random ±25° tilt + scale up
      stickers.forEach(s => {
        s.el.addEventListener('mouseenter', () => {
          s.hoverRot   = (Math.random() < 0.5 ? 1 : -1) * 25;
          s.targetRot  = s.baseRot + s.hoverRot;
          s.targetSc   = 1.15;
        });
        s.el.addEventListener('mouseleave', () => {
          s.targetRot = s.baseRot;
          s.targetSc  = 1;
        });
      });

      function lerp(a, b, t) { return a + (b - a) * t; }

      function tick() {
        const cx = window.innerWidth  / 2;
        const cy = window.innerHeight / 2;
        const ndx = (mx - cx) / cx;  // -1 to 1
        const ndy = (my - cy) / cy;

        stickers.forEach(s => {
          // Entry fly-in: lerp entry offset to 0
          if (s.ready) {
            s.ex = lerp(s.ex, 0, LERP_ENTRY);
            s.ey = lerp(s.ey, 0, LERP_ENTRY);
            s.opacity = lerp(s.opacity, s.targetOpacity, 0.045);
          }

          // Parallax
          const tpx = ndx * s.depth * PARA_RANGE;
          const tpy = ndy * s.depth * PARA_RANGE;
          s.px = lerp(s.px, tpx, LERP_PARA);
          s.py = lerp(s.py, tpy, LERP_PARA);

          // Rotation & scale
          s.rot = lerp(s.rot, s.targetRot, LERP_ROT);
          s.sc  = lerp(s.sc,  s.targetSc,  LERP_ROT);

          // Apply
          const tx = s.ex + s.px;
          const ty = s.ey + s.py;
          s.el.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) rotate(${s.rot.toFixed(2)}deg) scale(${s.sc.toFixed(3)})`;
          s.el.style.opacity   = s.opacity.toFixed(3);
        });

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }());
  </script>
</body>
</html>
