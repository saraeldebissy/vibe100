<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A 100-day daily AI building challenge. 100 prompts, 100 builds, shipped publicly." />
  <title>vibe100 — 100-day AI building challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #0a0a0a;
      color: #777;
      font-family: 'IBM Plex Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Terminal bar */
    .term-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-r { background: #ff5f56; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #27c93f; }

    .term-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #444;
      margin-left: 8px;
      letter-spacing: 0.05em;
    }

    /* Badge */
    .badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #C4773A;
      border: 1px solid rgba(196, 119, 58, 0.27);
      border-radius: 4px;
      padding: 4px 10px;
      display: inline-block;
    }

    .hero-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(64px, 12vw, 96px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
      display: inline-block;
      position: relative;
      animation: glitch-main 4s infinite;
    }

    .hero-title .vibe { color: #ffffff; }
    .hero-title .hundred { color: #C4773A; }

    .hero-title::before,
    .hero-title::after {
      content: 'vibe100';
      position: absolute;
      top: 0;
      left: 0;
      font-family: 'Syne', sans-serif;
      font-size: clamp(64px, 12vw, 96px);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
    }

    .hero-title::before {
      color: #ff0055;
      clip-path: polygon(0 22%, 100% 22%, 100% 40%, 0 40%);
      animation: glitch-r 4s infinite;
    }

    .hero-title::after {
      color: #00e5ff;
      clip-path: polygon(0 62%, 100% 62%, 100% 76%, 0 76%);
      animation: glitch-c 4s infinite;
    }

    @keyframes glitch-main {
      0%, 88%, 100% { transform: translateX(0); }
      90%           { transform: translateX(-3px); }
      92%           { transform: translateX(3px); }
      94%           { transform: translateX(-1px); }
      96%           { transform: translateX(0); }
    }

    @keyframes glitch-r {
      0%, 88%, 100% { opacity: 0; }
      89%, 93%      { opacity: 1; transform: translateX(-4px); }
      91%           { transform: translateX(4px); }
    }

    @keyframes glitch-c {
      0%, 88%, 100% { opacity: 0; }
      89%, 93%      { opacity: 1; transform: translateX(4px); }
      91%           { transform: translateX(-4px); }
    }
  </style>
</head>
<body>
  <main>
    <div class="container">
      <!-- Terminal bar -->
      <div class="term-bar">
        <span class="dot dot-r"></span>
        <span class="dot dot-y"></span>
        <span class="dot dot-g"></span>
        <span class="term-label">vibe100.co — session active</span>
      </div>

      <!-- Badge -->
      <div class="badge">// 100-day AI building challenge</div>

      <!-- Hero title -->
      <h1 class="hero-title">
        <span class="vibe">vibe</span><span class="hundred">100</span>
      </h1>
    </div>
  </main>
  <script>
    // scripts go here
  </script>
</body>
</html>
