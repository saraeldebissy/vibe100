<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="A 100-day daily AI building challenge. 100 prompts, 100 builds, shipped publicly." />
  <meta property="og:title" content="vibe100 — 100-day AI building challenge" />
  <meta property="og:description" content="A daily building challenge. 100 prompts, 100 builds, shipped publicly." />
  <meta property="og:url" content="https://vibe100.co" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="vibe100 — 100-day AI building challenge" />
  <meta name="twitter:description" content="A daily building challenge. 100 prompts, 100 builds, shipped publicly." />
  <title>vibe100 — 100-day AI building challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #0a0a0a;
      color: #777;
      font-family: 'IBM Plex Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Terminal bar */
    .term-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-r { background: #ff5f56; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #27c93f; }

    .term-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #444;
      margin-left: 8px;
      letter-spacing: 0.05em;
    }

    /* Badge */
    .badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #C4773A;
      border: 1px solid rgba(196, 119, 58, 0.27);
      border-radius: 4px;
      padding: 4px 10px;
      display: inline-block;
    }

    .hero-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(64px, 12vw, 96px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
      display: inline-block;
      position: relative;
      animation: glitch-main 4s infinite;
    }

    .hero-title .vibe { color: #ffffff; }
    .hero-title .hundred { color: #C4773A; }

    .hero-title::before,
    .hero-title::after {
      content: 'vibe100';
      position: absolute;
      top: 0;
      left: 0;
      font-family: 'Syne', sans-serif;
      font-size: clamp(64px, 12vw, 96px);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
    }

    .hero-title::before {
      color: #ff0055;
      clip-path: polygon(0 22%, 100% 22%, 100% 40%, 0 40%);
      animation: glitch-r 4s infinite;
    }

    .hero-title::after {
      color: #00e5ff;
      clip-path: polygon(0 62%, 100% 62%, 100% 76%, 0 76%);
      animation: glitch-c 4s infinite;
    }

    @keyframes glitch-main {
      0%, 88%, 100% { transform: translateX(0); }
      90%           { transform: translateX(-3px); }
      92%           { transform: translateX(3px); }
      94%           { transform: translateX(-1px); }
      96%           { transform: translateX(0); }
    }

    @keyframes glitch-r {
      0%, 88%, 100% { opacity: 0; }
      89%, 93%      { opacity: 1; transform: translateX(-4px); }
      91%           { transform: translateX(4px); }
    }

    @keyframes glitch-c {
      0%, 88%, 100% { opacity: 0; }
      89%, 93%      { opacity: 1; transform: translateX(4px); }
      91%           { transform: translateX(-4px); }
    }

    .subtext {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #777;
      line-height: 1.7;
      max-width: 480px;
    }

    .accent { color: #C4773A; }

    .typewriter-row {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 20px;
    }

    .tw-arrow { color: #C4773A; flex-shrink: 0; }

    .tw-text { color: #aaa; }

    .tw-cursor {
      display: inline-block;
      width: 0;
      height: 14px;
      border-right: 2px solid #aaa;
      vertical-align: middle;
      margin-left: 1px;
      animation: cursor-blink 1s step-end infinite;
    }

    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .form-wrap {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 500px;
    }

    .email-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-row {
      display: flex;
    }

    .email-input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      background: #111;
      border: 1px solid #333;
      border-right: none;
      border-radius: 6px 0 0 6px;
      color: #ccc;
      padding: 13px 16px;
      flex: 1;
      outline: none;
      transition: border-color 0.15s;
    }

    .email-input::placeholder { color: #444; }

    .email-input:focus { border-color: #C4773A; }

    .submit-btn {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: #C4773A;
      color: #0a0a0a;
      border: none;
      border-radius: 0 6px 6px 0;
      padding: 13px 22px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .submit-btn:hover { background: #d4843f; }
    .submit-btn:disabled { background: #7a4a23; cursor: not-allowed; }

    .fine-print {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #444;
      letter-spacing: 0.04em;
    }

    .form-error {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #ff6b6b;
      min-height: 16px;
    }

    .success-msg {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #C4773A;
      border: 1px solid rgba(196, 119, 58, 0.2);
      background: rgba(196, 119, 58, 0.04);
      border-radius: 6px;
      padding: 13px 16px;
      letter-spacing: 0.02em;
    }

    .stats-row {
      display: flex;
      gap: 32px;
      padding-top: 20px;
      border-top: 1px solid #1a1a1a;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }

    .stat-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0, 0, 0, 0.06) 3px,
        rgba(0, 0, 0, 0.06) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    @media (max-width: 480px) {
      .hero-title {
        font-size: 56px;
        letter-spacing: -2px;
      }

      .hero-title::before,
      .hero-title::after {
        font-size: 56px;
        letter-spacing: -2px;
      }

      .submit-btn {
        padding: 13px 14px;
        font-size: 12px;
      }

      .stats-row {
        gap: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="container">
      <!-- Terminal bar -->
      <div class="term-bar">
        <span class="dot dot-r"></span>
        <span class="dot dot-y"></span>
        <span class="dot dot-g"></span>
        <span class="term-label">vibe100.co — session active</span>
      </div>

      <!-- Badge -->
      <div class="badge">// 100-day AI building challenge</div>

      <!-- Hero title -->
      <h1 class="hero-title">
        <span class="vibe">vibe</span><span class="hundred">100</span>
      </h1>

      <!-- Subtext -->
      <p class="subtext">
        A daily building challenge.
        <span class="accent">100 prompts, 100 builds,</span>
        shipped publicly.
      </p>

      <!-- Typewriter row -->
      <div class="typewriter-row">
        <span class="tw-arrow">›</span>
        <span class="tw-text" id="tw-text"></span><span class="tw-cursor"></span>
      </div>

      <!-- Email form -->
      <div class="form-wrap" id="form-wrap">
        <form class="email-form" id="email-form" novalidate>
          <div class="input-row">
            <input
              type="email"
              id="email-input"
              class="email-input"
              placeholder="Enter your email to receive daily prompts"
              required
              autocomplete="email"
            />
            <button type="submit" class="submit-btn" id="submit-btn">Join Vibe100</button>
          </div>
          <p class="fine-print">No spam. No data sharing. Just build prompts.</p>
          <p class="form-error" id="form-error" aria-live="polite"></p>
        </form>

        <div class="success-msg" id="success-msg" hidden>
          You're in. Day 1 prompt is on its way. 🚀
        </div>
      </div>

      <!-- Stats row -->
      <div class="stats-row">
        <div class="stat">
          <span class="stat-num">100</span>
          <span class="stat-label">days</span>
        </div>
        <div class="stat">
          <span class="stat-num">1/day</span>
          <span class="stat-label">build</span>
        </div>
        <div class="stat">
          <span class="stat-num">∞</span>
          <span class="stat-label">shipped</span>
        </div>
      </div>
    </div>

    <!-- Scanline overlay -->
    <div class="scanlines" aria-hidden="true"></div>
  </main>
  <script>
    (function () {
      const sentences = [
        "The best way to go from AI-curious to AI-native.",
        "Join and receive a daily prompt every day.",
        "Build with any tool you like.",
        "Share your build and get featured."
      ];

      const el = document.getElementById('tw-text');
      let current = 0;
      let charIndex = 0;
      let isDeleting = false;

      function tick() {
        const text = sentences[current];

        if (!isDeleting) {
          el.textContent = text.slice(0, charIndex + 1);
          charIndex++;
          if (charIndex === text.length) {
            isDeleting = true;
            setTimeout(tick, 1800);
            return;
          }
        } else {
          el.textContent = text.slice(0, charIndex - 1);
          charIndex--;
          if (charIndex === 0) {
            isDeleting = false;
            current = (current + 1) % sentences.length;
            charIndex = 0;
            setTimeout(tick, 300);
            return;
          }
        }

        setTimeout(tick, isDeleting ? 25 : 45);
      }

      tick();
    }());

    (function () {
      const KIT_ENDPOINT = 'https://app.convertkit.com/forms/9259428/subscriptions';

      const form = document.getElementById('email-form');
      const input = document.getElementById('email-input');
      const btn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('form-error');
      const successEl = document.getElementById('success-msg');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorEl.textContent = '';

        const email = input.value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          errorEl.textContent = 'Please enter a valid email address.';
          input.focus();
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Joining...';

        try {
          const res = await fetch(KIT_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email_address: email })
          });

          if (!res.ok) throw new Error('Kit API returned ' + res.status);

          form.hidden = true;
          successEl.hidden = false;
        } catch (err) {
          errorEl.textContent = 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Join Vibe100';
        }
      });
    }());
  </script>
</body>
</html>
