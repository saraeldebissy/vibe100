<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A 100-day daily AI building challenge. 100 prompts, 100 builds, shipped publicly." />
  <title>vibe100 — 100-day AI building challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #0a0a0a;
      color: #777;
      font-family: 'IBM Plex Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Terminal bar */
    .term-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-r { background: #ff5f56; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #27c93f; }

    .term-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #444;
      margin-left: 8px;
      letter-spacing: 0.05em;
    }

    /* Badge */
    .badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #C4773A;
      border: 1px solid rgba(196, 119, 58, 0.27);
      border-radius: 4px;
      padding: 4px 10px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <main>
    <div class="container">
      <!-- Terminal bar -->
      <div class="term-bar">
        <span class="dot dot-r"></span>
        <span class="dot dot-y"></span>
        <span class="dot dot-g"></span>
        <span class="term-label">vibe100.co — session active</span>
      </div>

      <!-- Badge -->
      <div class="badge">// 100-day AI building challenge</div>
    </div>
  </main>
  <script>
    // scripts go here
  </script>
</body>
</html>
